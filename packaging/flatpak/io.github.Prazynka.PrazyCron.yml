app-id: io.github.Prazynka.PrazyCron
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: prazycron

# PrazyCron manages host scheduling facilities. This manifest is intentionally
# marked experimental because a conventional Flatpak sandbox is a poor fit for
# modifying host Cron files and systemd units.
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --talk-name=org.freedesktop.systemd1
  - --talk-name=org.freedesktop.PolicyKit1

modules:
  - name: prazycron
    buildsystem: simple
    build-commands:
      - install -d /app/lib/prazycron /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps /app/share/prazycron
      - cp -a prazycron/. /app/lib/prazycron/
      - install -Dm755 packaging/flatpak/prazycron-flatpak /app/bin/prazycron
      - install -Dm644 packaging/flatpak/io.github.Prazynka.PrazyCron.desktop /app/share/applications/io.github.Prazynka.PrazyCron.desktop
      - install -Dm644 packaging/flatpak/io.github.Prazynka.PrazyCron.metainfo.xml /app/share/metainfo/io.github.Prazynka.PrazyCron.metainfo.xml
      - install -Dm644 assets/prazycron-512.png /app/share/icons/hicolor/512x512/apps/io.github.Prazynka.PrazyCron.png
      - install -Dm644 assets/status-on.png /app/share/prazycron/status-on.png
      - install -Dm644 assets/status-off.png /app/share/prazycron/status-off.png
    sources:
      - type: dir
        path: ../..
