name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, private commands, or sensitive paths.
  - type: input
    id: version
    attributes:
      label: PrazyCron version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Linux distribution and desktop
      placeholder: "Ubuntu Cinnamon 26.04"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GUI, TUI, command line]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostic output
      description: Output from `prazycron --diagnose`, with sensitive information removed.
