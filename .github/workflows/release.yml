name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb cron util-linux systemd policykit-1 desktop-file-utils appstream dpkg-dev zip
          python -m pip install Pillow
      - name: Test and build release assets
        run: ./scripts/make-release.sh
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/prazycron_*_all.deb
            dist/prazycron-*-source.tar.gz
            dist/SHA256SUMS
