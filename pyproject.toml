[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prazycron"
version = "2.1.0"
description = "PrazyCron Task Manager — Cron made simple."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Prazynka"}]
keywords = ["cron", "crontab", "systemd", "scheduler", "Linux", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Systems Administration",
  "Environment :: X11 Applications :: Tk",
  "Environment :: Console :: Curses",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Prazynka/prazycron"
Repository = "https://github.com/Prazynka/prazycron"
Issues = "https://github.com/Prazynka/prazycron/issues"
Changelog = "https://github.com/Prazynka/prazycron/blob/main/CHANGELOG.md"

[project.scripts]
prazycron = "prazycron.main:main"
prazycron-run = "prazycron.execution:runner_main"

[tool.setuptools]
packages = ["prazycron"]
